<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra elegante -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#63141B" flood-opacity="0.45" />
    </filter>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E27" />
      <stop offset="100%" stop-color="#550E14" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B8BCBF" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E4E7" />
    </linearGradient>
  </defs>

  <g transform="translate(0, -10)" filter="url(#dropGlow)">
    <!-- 1. HEMISFERIO IZQUIERDO: ARCO DE SATÉN / PLATA (Lado izquierdo del esmoquin) -->
    <!-- Arco semicircular de solapa izquierda -->
    <path d="M 240,40 A 200,200 0 0,0 240,440" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- 2. HEMISFERIO DERECHO: SOLAPA DE ESMOQUIN EN VINO TINTO IMPERIAL -->
    <!-- Semicírculo derecho completo que forma el cuerpo del saco -->
    <path d="M 250,40 A 200,200 0 0,1 250,440 Z" 
          fill="url(#burgundyGrad)" />

    <!-- 3. PECHERA DE LA CAMISA (Triángulo blanco puro que abre el smoking) -->
    <path d="M 250,40 L 365,115 L 250,440 Z" 
          fill="url(#shirtGrad)" />

    <!-- 4. PAÑUELO DE BOLSILLO / DETALLE TRIANGULAR DE GALA (Vino Tinto sobre la pechera) -->
    <polygon points="260,75 302,125 260,125" 
             fill="url(#burgundyGrad)" />

    <!-- 5. LÍNEA CENTRAL DE BOTONES DE GALA (Muescas / Botones del smoking) -->
    <!-- Columna central que divide el traje -->
    <line x1="250" y1="40" x2="250" y2="440" stroke="#08080A" stroke-width="3" />

    <!-- Botones esféricos en corte y relieve -->
    <circle cx="250" cy="145" r="9" fill="#08080A" />
    <circle cx="250" cy="190" r="9" fill="#08080A" />
    <circle cx="250" cy="235" r="9" fill="#08080A" />
    <circle cx="250" cy="280" r="9" fill="#08080A" />

    <!-- Destello sutil de luz en los botones -->
    <circle cx="248" cy="143" r="3" fill="#B8BCBF" opacity="0.6" />
    <circle cx="248" cy="188" r="3" fill="#B8BCBF" opacity="0.6" />
    <circle cx="248" cy="233" r="3" fill="#B8BCBF" opacity="0.6" />
    <circle cx="248" cy="278" r="3" fill="#B8BCBF" opacity="0.6" />
  </g>
</svg>
